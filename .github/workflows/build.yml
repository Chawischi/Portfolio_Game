name: Build Godot Game

on:
  push:
    tags:
      - 'v*'

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export Game
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: "https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip"
          godot_export_templates_download_url: "https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_export_templates.tpz"
          relative_project_path: ./
          archive_output: true
          cache: true

      - name: Create Release
        uses: ncipollo/release-action@v1.18.0
        with:
          tag: ${{ github.ref_name }}
          name: "One Last Climb ${{ github.ref_name }}"
          artifacts: ${{ steps.export.outputs.archive_directory }}/*
          prerelease: true
          body: |
            **Windows:** extraia o .zip e execute o .exe.
            **Linux:** extraia o .zip, rode `chmod +x` no executável e depois execute.